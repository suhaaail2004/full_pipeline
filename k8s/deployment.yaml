apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodista-pipeline
  namespace: argocd
  labels:
    app: foodista
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodista
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: foodista
        tier: frontend
    spec:
      containers:
        - name: foodista
          image: 8089278330/foodista:2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
